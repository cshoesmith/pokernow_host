app = 'pokernow-host'
primary_region = 'iad'

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  VNBT_POKER_DATA = "/app/data"

[mounts]
  source = "poker_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
