{% extends "base.html" %}
{% block title %}Setup{% endblock %}
{% block content %}
<section style="max-width:440px; margin:60px auto;">
  <h2>🃏 First-time setup</h2>
  <p class="muted" style="margin-top:4px;">Create your group and manager account to get started.</p>
  {% if error %}
    <p class="err" style="margin-top:8px;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/setup" style="display:flex; flex-direction:column; gap:10px; margin-top:14px;">
    <input name="group_name" placeholder="Group name (e.g. 'Friday Night Poker')" required>
    <hr style="border:none; border-top:1px solid var(--line); margin:4px 0;">
    <input name="username" placeholder="Your username" required autocomplete="username">
    <input name="password" type="password" placeholder="Password (8+ characters)" required autocomplete="new-password">
    <input name="confirm" type="password" placeholder="Confirm password" required autocomplete="new-password">
    <button class="primary" type="submit">Create account</button>
  </form>
</section>
{% endblock %}
